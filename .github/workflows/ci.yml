deploy:
    runs-on: ubuntu-latest
    needs: [build, test]
    steps:
      - name: Download JAR artifact
        uses: actions/download-artifact@v4
        with:
          name: app-jar
          path: ./artifact

      - name: Copy JAR to EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_KEY }}
          source: "./artifact/*.jar"
          target: "/home/${{ secrets.EC2_USER }}/deploy/"
          strip_components: 1 # Esto quita la carpeta 'artifact' al copiar

      - name: Deploy on EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_KEY }}
          script: |
            # 1. Instalar Java 21 si falta (Amazon Linux 2023)
            if ! command -v java &> /dev/null; then
              echo "Instalando Java 21..."
              sudo dnf install -y java-21-amazon-corretto-headless
            fi

            # 2. Definir rutas en el HOME para evitar problemas de permisos
            APP_DIR="$HOME/user-service"
            mkdir -p $APP_DIR

            # 3. Detener la aplicación anterior
            echo "Limpiando procesos en puerto 8080..."
            sudo fuser -k 8080/tcp || true
            sleep 2

            # 4. Mover el JAR a su lugar final
            mv $HOME/deploy/*.jar $APP_DIR/app.jar

            # 5. Arrancar con las variables del RDS
            cd $APP_DIR
            nohup java -jar app.jar \
              --DB_HOST="${{ secrets.DB_HOST }}" \
              --DB_PORT="5432" \
              --DB_NAME="postgres" \
              --DB_USERNAME="postgres" \
              --DB_PASSWORD="${{ secrets.DB_PASSWORD }}" \
              > app.log 2>&1 &

            echo "Aplicación iniciada. PID: $!"
            sleep 8
            tail -n 20 app.log