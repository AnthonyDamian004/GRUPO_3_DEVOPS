name: CI/CD Pipeline

on:
  push:
    branches: [master, main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: temurin
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build (skip tests)
        run: ./gradlew build -x test --no-daemon

      - name: Upload JAR artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-jar
          path: build/libs/*.jar
          retention-days: 1

  test:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: temurin
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Run tests
        run: ./gradlew test --no-daemon

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-report
          path: build/reports/tests/test/
          retention-days: 7

  deploy:
    runs-on: ubuntu-latest
    needs: [build, test]
    steps:
      - name: Download JAR artifact
        uses: actions/download-artifact@v4
        with:
          name: app-jar
          path: ./artifact

      - name: Copy JAR to EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_KEY }}
          source: "./artifact/*.jar"
          target: "/home/${{ secrets.EC2_USER }}/app-temp"
          strip_components: 1

      - name: Deploy on EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_KEY }}
          script: |
            # 1. Definir rutas (usando el home para evitar líos de permisos)
            APP_DIR="/home/${{ secrets.EC2_USER }}/user-service"
            mkdir -p $APP_DIR

            # 2. Detener la aplicación anterior si está usando el puerto 8080
            echo "Deteniendo procesos previos en el puerto 8080..."
            sudo fuser -k 8080/tcp || true

            # 3. Mover el nuevo JAR desde la carpeta temporal a la carpeta de ejecución
            mv /home/${{ secrets.EC2_USER }}/app-temp/*.jar $APP_DIR/app.jar

            # 4. Arrancar la aplicación inyectando las variables del RDS
            echo "Arrancando la aplicación..."
            cd $APP_DIR
            nohup java -jar app.jar \
              --DB_HOST=${{ secrets.DB_HOST }} \
              --DB_PORT=5432 \
              --DB_NAME=postgres \
              --DB_USERNAME=postgres \
              --DB_PASSWORD=${{ secrets.DB_PASSWORD }} \
              > app.log 2>&1 &

            # 5. Verificación rápida
            sleep 10
            if grep -q "Started" app.log; then
              echo "¡Despliegue exitoso! La aplicación está corriendo."
            else
              echo "Error: La aplicación no parece haber arrancado. Revisa app.log."
              exit 1
            fi