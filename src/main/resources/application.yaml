spring:
  application:
    name: user-service
  
  # --- Configuración para recibir las variables ---
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:userservice}
    username: ${DB_USERNAME:userservice}
    password: ${DB_PASSWORD:userservice}
    driver-class-name: org.postgresql.Driver
  
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  # ------------------------------------------------

  jackson:
    deserialization:
      fail-on-unknown-properties: false

logging:
  pattern:
    level: "%5p [%X{correlationId}]"